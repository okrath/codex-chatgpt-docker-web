name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run verify

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build the Docker runtime image
        run: docker build -f docker/Dockerfile -t codex-chatgpt-web:ci .
      - name: Smoke the container entrypoint dependencies
        run: |
          docker run --rm --entrypoint /bin/bash codex-chatgpt-web:ci -lc '
            set -e
            command -v Xvfb
            command -v x11vnc
            command -v websockify
            command -v socat
            command -v curl
            /usr/local/bin/chromium-no-sandbox --version
            bun /app/src/cli.ts --version
          '

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
      - name: Lint GitHub Actions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -config-file .github/actionlint.yaml .github/workflows/*.yml
