services:
  codex-chatgpt-web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: codex-chatgpt-web
    init: true
    restart: unless-stopped
    # Chromium needs a large shared-memory segment.
    shm_size: 2gb
    ports:
      # Responses bridge: the host port MUST stay 17841 because setup writes
      # openai_base_url = http://127.0.0.1:17841/v1 into the Codex config.
      - "127.0.0.1:17841:8300"
      # noVNC screen of the container's Chromium (sign-in + watching turns).
      - "127.0.0.1:7900:7900"
    volumes:
      # Persistent app home: config, ChatGPT login state, logs, diagnostics.
      # Must be a named volume (it hosts a Unix socket in full mode).
      - codex-chatgpt-web-home:/root/.codex-chatgpt-web
      # Host Codex config: setup installs/uninstalls the model route here.
      - ~/.codex:/data/codex
    environment:
      # Set REPLACE_CODEX_ROUTE=1 for the first boot when ~/.codex/config.toml
      # already contains a custom or previously installed openai_base_url.
      REPLACE_CODEX_ROUTE: "${REPLACE_CODEX_ROUTE:-0}"
      # On by default: deliver an over-budget Luna turn as ordered preload messages
      # instead of collapsing history. Disable with
      # `CODEX_CHATGPT_WEB_LUNA_PRELOAD=off docker compose up -d`.
      CODEX_CHATGPT_WEB_LUNA_PRELOAD: "${CODEX_CHATGPT_WEB_LUNA_PRELOAD:-on}"
      # Testing/tuning knob: lower the Luna slimming/preload threshold (min 1000) so slimming and
      # preload engage on ordinary threads. Empty = the real 28k transport budget. Never raises it.
      CODEX_CHATGPT_WEB_LUNA_BUDGET_OVERRIDE: "${CODEX_CHATGPT_WEB_LUNA_BUDGET_OVERRIDE:-}"
      # Max preload parts before falling back to collapse (Free tier throttles ~3 rapid messages).
      # Empty = code default (3). Raise it only to exercise the failure/fallback path in testing.
      CODEX_CHATGPT_WEB_LUNA_PRELOAD_MAX_PARTS: "${CODEX_CHATGPT_WEB_LUNA_PRELOAD_MAX_PARTS:-}"
      # Per-part preload acknowledgement timeout in ms (min 5000). Empty = code default (180000).
      # Lower it only to exercise the delivery-failure fallback quickly in testing.
      CODEX_CHATGPT_WEB_LUNA_PRELOAD_TIMEOUT_MS: "${CODEX_CHATGPT_WEB_LUNA_PRELOAD_TIMEOUT_MS:-}"
      # Off by default until its live smoke passes: lets a full-mode turn answer one scoped research
      # question in its own Temporary Chat, which spends an extra message per call on the account.
      # Enable with `CODEX_CHATGPT_WEB_SUBAGENT=on docker compose up -d`.
      CODEX_CHATGPT_WEB_SUBAGENT: "${CODEX_CHATGPT_WEB_SUBAGENT:-off}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:17841/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      # First boot blocks on the interactive ChatGPT sign-in before serving.
      start_period: 15m

volumes:
  codex-chatgpt-web-home:
